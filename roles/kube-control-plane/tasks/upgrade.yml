---
# Refuse a >1-minor Kubernetes version skew before kubeadm runs; a re-run at skew 0 passes.
- name: Read the control-plane node's current Kubernetes version for the skew check
  ansible.builtin.command:
    cmd: >-
      kubectl get node {{ kubernetes_hostname }}
      -o jsonpath={.status.nodeInfo.kubeletVersion}
      --kubeconfig /etc/kubernetes/super-admin.conf
  register: kube_cp_skew_version
  changed_when: false

- name: Assert the Kubernetes version skew is within one minor
  vars:
    skew_current: "{{ kube_cp_skew_version.stdout | regex_replace('^v', '') }}"
    skew_target: "{{ kubernetes_version | regex_replace('^v', '') }}"
  ansible.builtin.assert:
    that:
      - skew_target.split('.')[0] | int == skew_current.split('.')[0] | int
      - (skew_target.split('.')[1] | int - skew_current.split('.')[1] | int) | abs <= 1
    fail_msg: >-
      Kubernetes version-skew violation: target {{ skew_target }} is more than one minor from the
      control-plane's current {{ skew_current }} — kubeadm upgrade refused
    success_msg: "Version skew OK: {{ skew_current }} -> {{ skew_target }} (<= 1 minor)"

- name: Renew certificates
  register: renew_certs
  changed_when: renew_certs.rc == 0
  ansible.builtin.command: "{{ item }}"
  loop:
    - "kubeadm certs renew super-admin.conf"
    - "kubeadm certs renew admin.conf"
    - "kubeadm certs renew apiserver"
    - "kubeadm certs renew apiserver-kubelet-client"
    - "kubeadm certs renew controller-manager.conf"
    - "kubeadm certs renew front-proxy-client"
    - "kubeadm certs renew scheduler.conf"

- name: Ensuring kubeadm-upgrade-config.yml config file is present on machine
  ansible.builtin.template:
    src: "kubeadm-upgrade-config.yml.j2"
    dest: "{{ kubeadm_upgrade_config_file }}"
    mode: "0600"

# Poll healthz after the sysext swap so the upgrade starts as soon as the API settles; retries below are the fallback.
- name: Wait for the API to be serving before the upgrade
  register: cp_api_health
  until: cp_api_health.rc == 0 and cp_api_health.stdout == 'ok'
  retries: 18
  delay: 5
  changed_when: false
  failed_when: false
  ansible.builtin.command: "kubectl get --raw=/healthz --kubeconfig /etc/kubernetes/super-admin.conf"

- name: Upgrade Control Plane member with kubeadm
  register: kubeadm_upgrade
  changed_when: kubeadm_upgrade.rc == 0 and "[upgrade] SUCCESS" in kubeadm_upgrade.stdout
  # Retry the apply: kubeadm's preflight health-check pod can transiently fail just after the sysext swap (safe, pre-change).
  until: kubeadm_upgrade.rc == 0
  retries: 3
  delay: 30
  ansible.builtin.command: "kubeadm upgrade apply --config {{ kubeadm_upgrade_config_file }}"

# kubeadm upgrades CoreDNS and kube-proxy only when it sees the new kube-apiserver Pod on every
# control plane node; otherwise it skips them without an error. When all the kube-apiserver Pods run
# the new image, we compare the CoreDNS and kube-proxy images with the ones kubeadm expects, to fail
# instead. The check does not run until the last control plane node is upgraded.
- name: Get the images expected by kubeadm
  ansible.builtin.command: kubeadm config images list --config {{ kubeadm_config_file }}
  register: kubeadm_expected_images
  changed_when: false

- name: Get the kube-apiserver images of the control plane nodes
  ansible.builtin.command: >
    kubectl -n kube-system get pods -l component=kube-apiserver --kubeconfig /etc/kubernetes/super-admin.conf
    -o jsonpath={.items[*].spec.containers[0].image}
  register: apiserver_images
  changed_when: false

- name: Verify CoreDNS and kube-proxy upgrade
  when: apiserver_images.stdout.split() | difference(kubeadm_expected_images.stdout_lines) | length == 0
  block:
    - name: Get the CoreDNS and kube-proxy images in the cluster
      ansible.builtin.command: >
        kubectl -n kube-system get {{ item.resource }} --kubeconfig /etc/kubernetes/super-admin.conf
        -o jsonpath={.spec.template.spec.containers[0].image}
      loop:
        - { phase: addon/coredns, resource: deployment/coredns }
        - { phase: addon/kube-proxy, resource: daemonset/kube-proxy }
      loop_control:
        label: "{{ item.resource }}"
      when: item.phase not in kubeadm_skip_phases
      register: addon_images
      changed_when: false

    - name: Check that CoreDNS and kube-proxy have been upgraded
      ansible.builtin.assert:
        that: item.stdout in kubeadm_expected_images.stdout_lines
        fail_msg: >-
          {{ item.item.resource }} runs {{ item.stdout }}, which is not an image of Kubernetes {{ kubernetes_version }}
          ({{ kubeadm_expected_images.stdout_lines | join(', ') }}). kubeadm skipped the addons upgrade.
        quiet: true
      loop: "{{ addon_images.results | rejectattr('skipped', 'defined') | list }}"
      loop_control:
        label: "{{ item.item.resource }}"

# Create the kubelet patches dir on control-plane nodes (workers get it on join) before templating the patch.
- name: Ensure the kubelet patches directory exists
  ansible.builtin.file:
    path: "{{ kubelet_config_path }}/patches"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Re-template the kubelet patch but let change-detection drive the notify, so kubelet only restarts when it differs.
- name: Generate KubeletConfiguration patches file from template
  ansible.builtin.template:
    src: KubeletConfiguration-v1beta1.yml.j2
    dest: "{{ kubelet_config_path }}/patches/kubeletconfiguration.yaml"
    mode: "0644"
  notify:
    - Apply kubelet-config patches
    - Restart kubelet
    - Kubelet verifications
