---
# Markdown rules for roles/*/README.md, checked by `mise run docs-check`.
# Rule values of the organisation's rule set, sighupio/distribution .rules/.markdown-lint.yml.
# Rules: https://github.com/DavidAnson/markdownlint

# Rules by id
MD004: false # Unordered list style
MD007:
  indent: 2 # Unordered list indentation
MD013:
  line_length: 808 # Line length
MD024: false # Multiple headers with the same content
MD026:
  punctuation: ".,;:!。，；:" # List of not allowed
MD029: false # Ordered list item prefix
MD033: false # Allow inline HTML
MD034: false # Allow bare-URLs in Markdown, GitHub and Docusaurus support them
MD036: false # Emphasis used instead of a heading
MD041: false # First line in a file should be a top-level heading

# Rules by tags
blank_lines: false # Error on blank lines
