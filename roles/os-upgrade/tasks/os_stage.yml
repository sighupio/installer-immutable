---
# STAGE half: stage the pinned Flatcar payload on the inactive partition before the drain; os_reboot.yml reboots into it.

# Downgrades are not supported: state in /var migrated by a newer OS may break an older one
- name: Fail if the node runs a newer Flatcar than the target
  ansible.builtin.assert:
    that:
      - not (ansible_facts['distribution_version'] is version(os_update_target_version, '>'))
    fail_msg: >-
      Node runs Flatcar {{ ansible_facts['distribution_version'] }}, newer than the target
      {{ os_update_target_version }}: downgrades are not supported

# Capture "behind target" ONCE (the reboot in os_reboot.yml re-gathers facts; a live check would flip).
- name: Record whether the node is behind the target OS version
  ansible.builtin.set_fact:
    os_update_behind: "{{ ansible_facts['distribution_version'] is version(os_update_target_version, '<') }}"

- name: Stage the target OS version on the inactive partition
  when: os_update_behind
  vars:
    os_update_arch: "{{ node_arch | default('arm64' if ansible_facts['architecture'] == 'aarch64' else 'x86-64') }}"
    # flatcar-update deletes this directory after a successful stage; after a failure the payload stays for the next run.
    os_update_payload_path: /var/tmp/flatcar-update/flatcar_production_update.gz
    os_update_pin: "{{ os_update_payload_pins.get(os_update_arch, {}) }}"
  block:
    - name: Fail when immutable.yaml has no update payload for the architecture of the node
      ansible.builtin.assert:
        that:
          - os_update_pin.url | default('') | length > 0
          - os_update_pin.sha256 | default('') | length > 0
        fail_msg: >-
          The os_update_payload_pins variable has no url and sha256 for Flatcar {{ os_update_target_version }} on
          {{ os_update_arch }}. Add the flatcar.arch.{{ os_update_arch }}.update entry to immutable.yaml.
          The upgrade did not change or drain the node.
        quiet: true

    - name: Create the directory for the payload
      ansible.builtin.file:
        path: "{{ os_update_payload_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Download before any change on the node: a missing or bad payload stops the run here, before the drain.
    - name: Download the update payload
      # Ansible tasks get no DefaultEnvironment: pass spec.infrastructure.proxy (see sysext/tasks/component.yml).
      environment:
        http_proxy: "{{ http_proxy | default('') or omit }}"
        https_proxy: "{{ https_proxy | default('') or omit }}"
        no_proxy: "{{ no_proxy | default('') or omit }}"
        HTTP_PROXY: "{{ http_proxy | default('') or omit }}"
        HTTPS_PROXY: "{{ https_proxy | default('') or omit }}"
        NO_PROXY: "{{ no_proxy | default('') or omit }}"
      # Retry a connection failure instead of stopping the upgrade. A retry downloads the whole payload again,
      # so a checksum that does not match is not retried.
      register: os_update_payload_download
      until: >-
        os_update_payload_download is succeeded
        or (os_update_payload_download.msg | default('')) is not search('Request failed|timed out')
      retries: 5
      delay: 10
      ansible.builtin.get_url:
        url: "{{ os_update_pin.url }}"
        dest: "{{ os_update_payload_path }}"
        checksum: "sha256:{{ os_update_pin.sha256 }}"
        owner: root
        group: root
        mode: "0644"

    # Before update-engine runs: a node from before SD 1.36 still points to the Nebraska update server, and
    # flatcar-update can exit (port in use, OEM check) before it writes update.conf.
    - name: Disable the update checks of update-engine
      ansible.builtin.lineinfile:
        path: /etc/flatcar/update.conf
        regexp: "^SERVER="
        line: SERVER=disabled
        create: true
        owner: root
        group: root
        mode: "0644"

    # A fresh daemon has no update check in progress: flatcar-update fails during one, and with SERVER=disabled a
    # long-running daemon does one about every 45 minutes. Nodes from before SD 1.36 have update-engine masked.
    # With a proxy, Butane keeps it off the localhost requests.
    - name: Unmask and restart update-engine
      ansible.builtin.systemd:
        name: update-engine.service
        masked: false
        state: restarted

    - name: Read the status of update-engine
      register: os_update_pre_status
      changed_when: false
      ansible.builtin.command:
        cmd: update_engine_client -status

    # flatcar-update refuses to run while an update waits for a reboot, and update-engine forgot its version: stage again.
    - name: Discard the update that waits for a reboot
      when: "'UPDATE_STATUS_UPDATED_NEED_REBOOT' in os_update_pre_status.stdout"
      changed_when: true
      ansible.builtin.command:
        cmd: update_engine_client -reset_status

    # -V only labels the update: the pinned sha256 makes sure that the payload is this version.
    # -A writes only SERVER=disabled at the end: without it, flatcar-update writes back every old SERVER= line.
    - name: Stage the update payload with flatcar-update
      changed_when: true
      ansible.builtin.command:
        argv:
          - flatcar-update
          - -V
          - "{{ os_update_target_version }}"
          - -P
          - "{{ os_update_payload_path }}"
          - -A
          - -L
          - "{{ os_update_local_omaha_port }}"
          - -M
          - "{{ os_update_local_payload_port }}"
