[tools]
# Python, uv and Ansible versions taken from the Disitribution/Furyctl
# Ref:
# - https://github.com/sighupio/furyctl/blob/main/internal/tool/mise/config.go
# - https://github.com/sighupio/distribution/blob/main/kfd.yaml
"python" = "3.12"
"uv" = "0.9"
"pipx:ansible-core" = {"version"="2.21.0", "bin"="ansible"}
# tools for linting
yamlfmt = "0.21.0"
"pipx:yamllint" = "1.38.0"
"pipx:ansible-lint" = "26.4.0"
# used by scripts/bump-sysext.sh
yq = "4.53.6"
# tools for the role documentation (tasks docs and docs-check)
"pipx:ansible-docsmith" = "2.2.0"
node = "24"
"npm:markdownlint-cli2" = "0.23.3"

[tasks.lint]
description = "Run yamllint + ansible-lint (production profile, strict)"
run = [
  "yamllint .",
  "ansible-lint --profile production --strict",
]

[tasks.fmt]
description = "Format YAML in place with yamlfmt"
run = "yamlfmt"

[tasks."fmt-check"]
description = "Check YAML formatting without writing"
run = "yamlfmt -lint"

[tasks."lint-prod"]
description = "Alias of lint (production profile is the default)"
depends = ["lint"]

[tasks."test:argument-specs"]
description = "Validate role argument specs against fixtures (localhost, no cluster)"
run = "ansible-playbook tests/argument-specs/validate.yml"

[tasks."test:download-retries"]
description = "Check that every get_url task of the roles has a retry (fixtures first, then roles/)"
run = """
set -eu
check=scripts/check-download-retries.sh
fixtures=tests/download-retries/fixtures
# Prove the check on the fixtures before trusting what it says about roles/.
"$check" "$fixtures/pass.yml"
failed=0
for fixture in "$fixtures"/fail-*.yml; do
  if report="$("$check" "$fixture" 2>/dev/null)"; then
    echo "$fixture: the check did not report the download without a retry" >&2
    failed=1
  elif ! printf '%s\\n' "$report" | grep -qF "$fixture: "; then
    echo "$fixture: the report of the check does not name the file" >&2
    failed=1
  else
    echo "$fixture: reported, as expected"
  fi
done
[ "$failed" -eq 0 ]
"$check" roles
"""

[tasks."bump-sysext"]
description = "Bump a sysext in immutable.yaml with its release checksums (see scripts/bump-sysext.sh -h)"
run = "scripts/bump-sysext.sh"

[tasks.docs]
description = "Generate the variable reference of every role README from meta/argument_specs.yml"
run = "ansible-docsmith generate . --no-defaults --template-readme docs/templates/role-readme.md.j2"

[tasks."docs-check"]
description = "Check that every role README is up to date and follows the Markdown rules, writing nothing"
run = [
  "ansible-docsmith validate . --strict",
  "ansible-docsmith generate . --check --no-defaults --template-readme docs/templates/role-readme.md.j2",
  'markdownlint-cli2 "roles/*/README.md"',
  # a README created by the generator keeps its placeholder text until someone writes the role description
  "! grep -n FIXME roles/*/README.md",
]
