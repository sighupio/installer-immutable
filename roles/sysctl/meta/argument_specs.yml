---
argument_specs:
  main:
    short_description: Set custom kernel parameters via sysctl.d
    description: Writes custom kernel parameters to a sysctl.d file and reloads them, backing up original values first.
    options:
      sysctl_d_path:
        type: path
        required: false
        description: Directory holding sysctl.d configuration files; created if absent.
      sysctl_file_path:
        type: path
        required: false
        description: Destination file for the rendered custom kernel parameters.
      sysctl_dump_path:
        type: path
        required: false
        description: Path where original sysctl values are dumped before changes for restore.
      sysctl_parameters:
        type: list
        required: false
        description: List of custom kernel parameters as maps with name and value keys.
