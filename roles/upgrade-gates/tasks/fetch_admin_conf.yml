---
# Fetch super-admin.conf (system:masters, RBAC-independent) from a control-plane; the controller-side kubectl gates use it (dedicated etcd + worker plays too).
# Immutable is k8s >=1.29-only: super-admin.conf always exists on a healthy CP; if it is missing or the CP unreachable the fetch fails hard, no fallback.
- name: Fetch super-admin.conf from a control-plane node
  run_once: true
  delegate_to: "{{ groups['control_plane'] | first }}"
  ansible.builtin.fetch:
    src: /etc/kubernetes/super-admin.conf
    dest: ./super-admin.conf
    flat: true
