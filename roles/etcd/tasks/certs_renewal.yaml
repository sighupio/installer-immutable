- name: Set backup timestamp
  ansible.builtin.set_fact:
    etcd_backup_timestamp: "{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M-%S') }}"

- name: Ensure etcd backup directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/certs-backup/{{ etcd_backup_timestamp }}/etc-etcd-pki"
    state: directory
    mode: "0750"

- name: Backup etcd certificates
  ansible.builtin.copy:
    src: "{{ etcd_certs_dir }}/"
    dest: "{{ ansible_facts['env']['HOME'] }}/certs-backup/{{ etcd_backup_timestamp }}/etc-etcd-pki"
    remote_src: true
    mode: "0600"

- name: Renewing etcd certificates
  ansible.builtin.command: "{{ item }}"
  loop:
    - "kubeadm certs renew --cert-dir=/etc/etcd/pki --config=/etc/etcd/kubeadm-etcd.yml apiserver-etcd-client"
    - "kubeadm certs renew --cert-dir=/etc/etcd/pki --config=/etc/etcd/kubeadm-etcd.yml etcd-healthcheck-client"
    - "kubeadm certs renew --cert-dir=/etc/etcd/pki --config=/etc/etcd/kubeadm-etcd.yml etcd-peer"
    - "kubeadm certs renew --cert-dir=/etc/etcd/pki --config=/etc/etcd/kubeadm-etcd.yml etcd-server"
  changed_when: true

- name: Restart etcd to activate the renewed certs when the node will not reboot
  ansible.builtin.systemd:
    name: etcd
    daemon_reload: true
    state: restarted
  # Only a dedicated etcd node with no OS/sysext change won't reboot; otherwise the reboot activates the renewed certs (no redundant restart).
  when:
    - os_update_reboot | default(false) | bool
    - not (os_update_behind | default(false) | bool)
    - not (node_daemon_sysext_changed | default(false) | bool)
