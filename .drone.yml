---
kind: pipeline
type: docker
name: QA

node:
  performance: low

volumes:
  - name: mise-cache
    host:
      path: /root/mise_data_dir

steps:
  - name: install-tools
    image: quay.io/sighup/mise:v2026.6.14
    pull: always
    depends_on:
      - clone
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - |
        mise install
        eval "$(mise activate bash --shims)"

  - name: lint
    image: quay.io/sighup/mise:v2026.6.14
    pull: always
    depends_on:
      - install-tools
    environment:
      MISE_DATA_DIR: /mise-data
      CGO_ENABLED: 0
      GOCACHE: /drone/src/.go/cache
      GOMODCACHE: /drone/src/.go/modcache
      GOTMPDIR: /drone/src/.go/tmp
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - eval "$(mise activate bash --shims)"
      - mise run lint

  - name: fmt
    image: quay.io/sighup/mise:v2026.6.14
    pull: always
    depends_on:
      - install-tools
    environment:
      MISE_DATA_DIR: /mise-data
      CGO_ENABLED: 0
      GOCACHE: /drone/src/.go/cache
      GOMODCACHE: /drone/src/.go/modcache
      GOTMPDIR: /drone/src/.go/tmp
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - eval "$(mise activate bash --shims)"
      - mise run fmt-check

  - name: test argspec
    image: quay.io/sighup/mise:v2026.6.14
    pull: always
    depends_on:
      - install-tools
    environment:
      MISE_DATA_DIR: /mise-data
      CGO_ENABLED: 0
      GOCACHE: /drone/src/.go/cache
      GOMODCACHE: /drone/src/.go/modcache
      GOTMPDIR: /drone/src/.go/tmp
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - eval "$(mise activate bash --shims)"
      - "mise run test:argument-specs"

  - name: test download-retries
    image: quay.io/sighup/mise:v2026.6.14
    pull: always
    depends_on:
      - install-tools
    environment:
      MISE_DATA_DIR: /mise-data
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - eval "$(mise activate bash --shims)"
      - "mise run test:download-retries"

  - name: docs-check
    image: quay.io/sighup/mise:v2026.6.14
    pull: always
    depends_on:
      - install-tools
    environment:
      MISE_DATA_DIR: /mise-data
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - eval "$(mise activate bash --shims)"
      - mise run docs-check

  # Check the pins of immutable.yaml against the registry before a tag: a changed file for a pushed version, a
  # wrong sha256 or a bad URL fails here. Anonymous: the sd project is public, so the step needs no secret.
  - name: oci-dry-run
    image: quay.io/sighup/sd-oci-push-plugin:1.4.0_4.53.6
    pull: always
    depends_on: [clone]
    settings:
      mode: sync
      dry_run: true
    when:
      event:
        - pull_request
---
name: release
kind: pipeline
type: docker

node:
  performance: low

depends_on:
  - QA

trigger:
  ref:
    include:
      - refs/tags/**

steps:
  - name: prepare-tar-gz
    image: alpine:latest
    pull: always
    depends_on: [clone]
    commands:
      - tar -zcvf sd-installer-immutable-${DRONE_TAG}.tar.gz roles/ LICENSE README.md
    when:
      ref:
        include:
          - refs/tags/**

  - name: prepare-release-notes
    image: quay.io/sighup/fury-release-notes-plugin:3.12_2.10.0
    pull: always
    depends_on: [clone]
    settings:
      release_notes_file_path: release-notes.md
    when:
      ref:
        include:
          - refs/tags/**

  - name: publish-prerelease
    image: plugins/github-release
    pull: always
    depends_on:
      - prepare-tar-gz
      - prepare-release-notes
    settings:
      api_key:
        from_secret: GITHUB_TOKEN
      file_exists: overwrite
      files:
        - sd-installer-immutable-${DRONE_TAG}.tar.gz
      prerelease: true
      overwrite: true
      title: "SD Immutable Installer ${DRONE_TAG}"
      note: release-notes.md
      checksum:
        - md5
        - sha256
    when:
      ref:
        include:
          - refs/tags/v**-rc**

  - name: publish-stable
    image: plugins/github-release
    pull: always
    depends_on:
      - prepare-tar-gz
      - prepare-release-notes
    settings:
      api_key:
        from_secret: GITHUB_TOKEN
      file_exists: overwrite
      files:
        - sd-installer-immutable-${DRONE_TAG}.tar.gz
      prerelease: false
      overwrite: true
      title: "SD Immutable Installer ${DRONE_TAG}"
      note: release-notes.md
      checksum:
        - md5
        - sha256
    when:
      ref:
        exclude:
          - refs/tags/v**-rc**
        include:
          - refs/tags/v**

  # Push the sysext and Flatcar files of immutable.yaml before the installer, so no published installer
  # points to a file that is not in the registry.
  - name: sync-oci
    image: quay.io/sighup/sd-oci-push-plugin:1.4.0_4.53.6
    pull: always
    depends_on: [clone]
    settings:
      mode: sync
      username:
        from_secret: sd_registry_username
      password:
        from_secret: sd_registry_password
    when:
      ref:
        include:
          - refs/tags/v**

  # The OCI tag is immutable and the GitHub release is not, so push it after the GitHub release.
  - name: push-oci
    image: quay.io/sighup/sd-oci-push-plugin:1.4.0_4.53.6
    pull: always
    depends_on: [sync-oci, publish-prerelease, publish-stable]
    settings:
      repository: sd/installers/immutable
      artifact_type: installer
      username:
        from_secret: sd_registry_username
      password:
        from_secret: sd_registry_password
    when:
      ref:
        include:
          - refs/tags/v**
