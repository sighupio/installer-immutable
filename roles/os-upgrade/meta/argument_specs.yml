---
argument_specs:
  # Entry-point keys carry the .yml suffix to match how the distribution upgrade
  # playbooks invoke them (include_role tasks_from: <name>.yml). ansible-core does
  # not strip the extension when matching the arg spec, so the key must be exact.
  os_stage.yml:
    short_description: Stage a Flatcar operating system update on the inactive partition of the node.
    description: >-
      Fails when the node runs a Flatcar version newer than O(os_update_target_version): the role does not support
      downgrades. When the node runs an older version, the role downloads the payload from the URL in
      O(os_update_payload_pins) and compares its SHA-256 checksum with the pin. Then it stages the payload on the inactive A/B partition with C(flatcar-update).
      The role does all of this before the upgrade drains the node. Thus a missing or bad payload stops the upgrade
      while the node still serves. The role contacts no update server: it sets C(SERVER=disabled) in
      C(/etc/flatcar/update.conf), so that every update check of the update engine fails, as Flatcar recommends.
    options:
      os_update_target_version:
        type: str
        required: true
        description: Target Flatcar version, compared with the Flatcar version of the node.
      os_update_payload_pins:
        type: dict
        required: true
        description:
          - >-
            Pins of the Flatcar update payload of the target version, one for each architecture, from the
            C(flatcar.arch.<arch>.update) entries of C(immutable.yaml). The keys are the architectures, V(x86-64) and
            V(arm64). Each pin has the C(url) of C(flatcar_production_update.gz) and its C(sha256).
          - >-
            The checksum makes sure that the payload is O(os_update_target_version): C(flatcar-update) uses the
            target version only as a label.
      os_update_local_omaha_port:
        type: int
        required: false
        description: >-
          Port on the node of the local update server that C(flatcar-update) starts for the update engine. It must
          not be in use on the node.
      node_arch:
        type: str
        required: false
        choices: ["x86-64", "arm64"]
        description: >-
          Architecture of the node, the key into O(os_update_payload_pins). Defaults to V(arm64) on an C(aarch64)
          node and to V(x86-64) otherwise.
      os_update_local_payload_port:
        type: int
        required: false
        description: >-
          Port on the node of the local server that C(flatcar-update) starts to serve the payload. It must not be in
          use on the node.
  os_reboot.yml:
    short_description: Reboot the node into the staged Flatcar version and confirm that it booted.
    description:
      - >-
        When the node runs an older version than the target, the role stages the flatcar-python system extension of
        the new version. When O(os_update_reboot) is V(true) and an operating system update or a system extension
        waits for a reboot, the role reboots the node.
      - >-
        After an operating system update, the role checks that the node booted the target version. Then it marks the
        partition as good, so that the boot loader does not roll back at the next reboot. If the node booted the
        previous version, the role restores the previous system extensions and fails.
    options:
      os_update_target_version:
        type: str
        required: true
        description: Target Flatcar version that the booted system must match.
      os_update_reboot:
        type: bool
        required: false
        description: Whether the role can reboot the node. When V(false), the role does not reboot the node.
      os_update_reboot_timeout:
        type: int
        required: false
        description: Longest time, in seconds, that the role waits for the node to come back after the reboot.
