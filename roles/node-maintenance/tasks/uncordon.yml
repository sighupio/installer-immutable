---
# Close the window: uncordon only after the disruptive layers finish (node healthy), then wait for pods to settle.
- name: Uncordon the node after letting it settle
  ansible.builtin.command:
    cmd: "{{ kubectl_bin }} uncordon {{ kubernetes_hostname }} --kubeconfig {{ kubernetes_kubeconfig_path }}super-admin.conf"
  become: false
  delegate_to: localhost
  changed_when: true

# Before the pod wait: a wait that times out fails the play, and a marker left on a schedulable node
# would make the next upgrade drain it for nothing. Removing an absent annotation is not an error.
- name: Remove the marker of the drain
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_bin }} annotate node {{ kubernetes_hostname }}
      {{ node_upgrade_drain_marker }}-
      --kubeconfig {{ kubernetes_kubeconfig_path }}super-admin.conf
  become: false
  delegate_to: localhost
  changed_when: true

- name: Wait for the upgraded node's pods to be Ready
  # Ready, not only Running: the next phase rolls DaemonSets, and a pod deleted while not Ready leaves stale
  # Cilium LB state (cilium/cilium#44891). <2 non-True lines = only the header.
  when: not skip_pods_running_check
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      {{ kubectl_bin }} get pods -A
      --field-selector spec.nodeName={{ kubernetes_hostname }},status.phase!=Succeeded
      --kubeconfig {{ kubernetes_kubeconfig_path }}super-admin.conf
      -o custom-columns='READY:.status.conditions[?(@.type=="Ready")].status'
      | grep -cv True
    executable: /bin/bash
  become: false
  delegate_to: localhost
  register: node_upgrade_pods_not_ready
  until: node_upgrade_pods_not_ready.stdout | int < 2
  retries: "{{ pods_running_retries }}"
  delay: 15
  changed_when: false
