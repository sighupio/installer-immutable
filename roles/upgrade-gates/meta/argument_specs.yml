---
argument_specs:
  # Entry-point keys carry the .yml suffix to match how the distribution upgrade
  # playbooks invoke them (include_role tasks_from: <name>.yml). ansible-core does
  # not strip the extension when matching the arg spec, so the key must be exact.
  fetch_admin_conf.yml:
    short_description: Fetch super-admin.conf from a control-plane node to the furyctl host.
    description: >-
      Copies C(/etc/kubernetes/super-admin.conf) from the first node of the inventory group C(control_plane) to
      C(./super-admin.conf) on the furyctl host, once per run, for the checks that run C(kubectl) on the furyctl
      host. The run fails when the file cannot be fetched.
    options: {}
  infra_preflight.yml:
    short_description: Check the infrastructure of the node before the upgrade drains it.
    description: >-
      Fails when the root file system of the node has less free space than O(node_upgrade_min_free_bytes), when the
      C(.raw) image of a target of O(sysext_targets) does not answer an HTTP C(HEAD) request, or when the node lacks
      one of the two A/B operating system partitions, C(USR-A) and C(USR-B), that a rollback needs. The checks change
      nothing on the node.
    options:
      node_upgrade_min_free_bytes:
        type: int
        required: false
        description: >-
          Smallest free space, in bytes, on the root file system of the node. The system extensions and the Flatcar
          update payload use this space during the upgrade.
      sysext_targets:
        type: dict
        required: false
        description: >-
          Targets of the system extensions, in the format of the C(sysext_targets) variable of the sysext role. The
          role checks that the image of every target for the architecture of the node is reachable; when unset, it
          skips that check.
      sysext_arch:
        type: str
        required: false
        description: >-
          Architecture of the system extensions of the node, the key into the C(arch) map of each target. Defaults to
          O(node_arch) or, when that is not set, to V(arm64) on an C(aarch64) node and to V(x86-64) otherwise.
        choices: ["x86-64", "arm64"]
      node_arch:
        type: str
        required: false
        choices: ["x86-64", "arm64"]
        description: Architecture of the node. When set, it is the default of O(sysext_arch).
  sanity.yml:
    short_description: Check the node after its upgrade.
    description: >-
      Fails unless the kubelet, C(kubeadm) and C(kubectl) of the node report O(kubernetes_version), containerd
      reports the target version of its system extension when O(sysext_targets) gives one, the kubernetes system
      extension is merged, and the node is Ready. The role waits for the node to be Ready with C(kubectl) on the
      furyctl host.
    options:
      kubernetes_version:
        type: str
        required: true
        description: Target Kubernetes version that the kubelet, C(kubeadm) and C(kubectl) of the node must report.
      kubectl_bin:
        type: str
        required: false
        description: Path of C(kubectl) on the furyctl host, with which the role waits for the node to be Ready.
      kubernetes_kubeconfig_path:
        type: path
        required: false
        description: >-
          Directory on the furyctl host, ending with C(/), that holds C(super-admin.conf), the kubeconfig file of
          C(kubectl). The C(fetch_admin_conf.yml) entry point always writes the file as C(./super-admin.conf), whatever
          the value of this variable is.
      kubernetes_hostname:
        type: str
        required: false
        description: Name of the Kubernetes node. Defaults to the fully qualified domain name of the node.
      sysext_targets:
        type: dict
        required: false
        description: >-
          Targets of the system extensions, in the format of the C(sysext_targets) variable of the sysext role. The
          role reads only the C(version) of C(containerd), and skips the containerd check when it is missing.
  cluster_health_gate.yml:
    short_description: Check the health of the cluster before the upgrade touches any node.
    description: >-
      Fails unless the API server answers and every node is Ready; the nodes run one Kubernetes version, or two
      versions of which one is O(kubernetes_version), as after an interrupted upgrade that can resume; and every
      member of the etcd cluster is healthy. The C(kubectl) commands run on the furyctl host; the etcd check runs on
      the node, with the C(etcdctl) profile that the etcd role writes.
    options:
      kubernetes_version:
        type: str
        required: true
        description: >-
          Target Kubernetes version of the upgrade. A cluster whose nodes run two versions passes only when one of
          them is this one.
      kubectl_bin:
        type: str
        required: false
        description: Path of C(kubectl) on the furyctl host, with which the role reads the nodes of the cluster.
      kubernetes_kubeconfig_path:
        type: path
        required: false
        description: >-
          Directory on the furyctl host, ending with C(/), that holds C(super-admin.conf), the kubeconfig file of
          C(kubectl). The C(fetch_admin_conf.yml) entry point always writes the file as C(./super-admin.conf), whatever
          the value of this variable is.
