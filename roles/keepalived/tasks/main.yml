---
# Stage the keepalived extension during an upgrade. The new binary activates at the reboot,
# and not by a reload of the running service.
- name: Align the keepalived system extension during upgrade
  ansible.builtin.include_role:
    name: sysext
    tasks_from: align.yml
  vars:
    sysext_components:
      - keepalived
  when: upgrade | default(false) | bool

- name: Copy keepalived configuration file
  when: keepalived_cluster | bool
  register: keepalived_config
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: "600"

- name: Check keepalived configuration file for errors
  when: keepalived_config is changed
  changed_when: false
  ansible.builtin.command: keepalived --config-test

- name: Reload keepalived if needed
  ansible.builtin.systemd:
    name: keepalived
    state: reloaded
  when: keepalived_config is changed

# /etc is noexec on Flatcar, so keepalived cannot run this old script. The configuration now runs curl.
- name: Remove the old check API server script
  ansible.builtin.file:
    path: /etc/keepalived/check_api_server.sh
    state: absent

- name: Start keepalived service
  when: keepalived_cluster | bool
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: started
    masked: false

- name: Verify keepalived service is running # noqa command-instead-of-module
  when: keepalived_cluster | bool
  changed_when: false
  ansible.builtin.command: systemctl is-active keepalived

- name: Disable keepalived service
  when: not keepalived_cluster | bool
  ansible.builtin.systemd:
    name: keepalived
    enabled: false
    state: stopped
    masked: true
