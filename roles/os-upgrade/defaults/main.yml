---
# os-upgrade: Flatcar A/B layer — os_stage stages on the inactive partition, os_reboot reboots and marks good.

# --- Layer toggle (false by default → os_reboot does not reboot) -----------
# Playbooks set it true; os_stage acts only when the node is behind, os_reboot reboots only when this is set.
os_update_reboot: false

# --- Version targets (provided externally, never read from immutable.yaml here) --------------------------
# sysext_targets, os_update_target_version, os_update_payload_pins, kubernetes_version come from the rendered vars or -e on hand-runs.

# --- OS layer ------------------------------------------------------------------
# Local ports of flatcar-update (-L Omaha answer, -M payload): its defaults 9090/9091 clash with the Calico node metrics port.
os_update_local_omaha_port: 19090
os_update_local_payload_port: 19091
os_update_reboot_timeout: 600
