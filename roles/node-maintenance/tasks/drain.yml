---
# Open the window: cordon + drain to evict workloads before the disruptive layers; serial:1 preserves quorum.
# Mark before the drain: a run that fails inside the window leaves the node cordoned, and the marker is
# the only way the next run knows that the cordon is its own. The other order could leave a cordoned
# node without a marker. A failure here stops the play before the node is cordoned.
- name: Mark the node as drained by the upgrade
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_bin }} annotate node {{ kubernetes_hostname }}
      {{ node_upgrade_drain_marker }}=true --overwrite
      --kubeconfig {{ kubernetes_kubeconfig_path }}super-admin.conf
  become: false
  delegate_to: localhost
  changed_when: true

- name: Drain the node
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_bin }} drain {{ kubernetes_hostname }}
      --grace-period=60 --timeout=360s --force
      --ignore-daemonsets --delete-emptydir-data
      --kubeconfig {{ kubernetes_kubeconfig_path }}super-admin.conf
  become: false
  delegate_to: localhost
  # Retry: a transient etcd/API timeout while evicting must not abort the whole upgrade; drain is idempotent.
  register: node_drain
  until: node_drain.rc == 0
  retries: 3
  delay: 15
  changed_when: true
