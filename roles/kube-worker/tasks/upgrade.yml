---
# Refuse a >1-minor jump: kubeadm upgrades one minor per step (skipping minors unsupported). Version read live via the controller.
- name: Read the worker's current Kubernetes version for the step-delta check
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_bin }} get node {{ kubernetes_hostname }}
      -o jsonpath={.status.nodeInfo.kubeletVersion}
      --kubeconfig {{ kubernetes_kubeconfig_path }}admin.conf
  become: false
  delegate_to: localhost
  register: kube_worker_skew_version
  changed_when: false

- name: Assert the kubeadm upgrade step is within one minor
  vars:
    skew_current: "{{ kube_worker_skew_version.stdout | regex_replace('^v', '') }}"
    skew_target: "{{ kubernetes_version | regex_replace('^v', '') }}"
  ansible.builtin.assert:
    that:
      - skew_target.split('.')[0] | int == skew_current.split('.')[0] | int
      - (skew_target.split('.')[1] | int - skew_current.split('.')[1] | int) | abs <= 1
    fail_msg: >-
      kubeadm one-minor-per-step limit: target {{ skew_target }} is more than one minor above the worker's
      current {{ skew_current }} — kubeadm upgrade node moves one minor at a time
    success_msg: "Upgrade step OK: {{ skew_current }} -> {{ skew_target }} (<= 1 minor per step)"

# kubeadm upgrade node with --patches, then restart kubelet to load the config kubeadm just rewrote (the reboot already activated the new binary).
- name: Upgrade the node with kubeadm
  ansible.builtin.command:
    cmd: kubeadm upgrade node --patches {{ kubelet_config_path }}/patches/
  register: kube_worker_kubeadm_upgrade
  changed_when: kube_worker_kubeadm_upgrade.rc == 0

- name: Restart kubelet to load the post-reboot kubeadm upgrade config
  ansible.builtin.include_tasks: kubelet_restart.yml
